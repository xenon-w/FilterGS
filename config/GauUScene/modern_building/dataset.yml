root: /PATH/TO/YOUR/TRAINING/DATASET
PLYNAME: /PATH/TO/YOUR/TRAINING/DATASET/sparse/0/sparse.npz
scale3d: 1.
xyz_scale: 1.

dataset:
  module: LoG.dataset.colmap.ImageDataset
  args:
    root: $root
    pre_undis: True
    share_camera: False
    scales: [1, 2, 4, 8]
    crop_size: [-1, -1]
    znear: 0.001
    zfar: 100.
    scale3d: $scale3d
    ext: .JPG
    images: images
  
val_dataset:
  module: LoG.dataset.colmap.ImageDataset
  args:
    root: $root
    namelist: 
      - DJI_20231219112155_0006_Zenmuse-L1-mission
      - DJI_20231219113318_0129_Zenmuse-L1-mission
      - DJI_20231219115739_0159_Zenmuse-L1-mission
      - DJI_20231219161823_0120_Zenmuse-L1-mission
      - DJI_20231219164019_0123_Zenmuse-L1-mission
    cache: cache_val.pkl
    pre_undis: True
    share_camera: False
    scales: [4]
    znear: 0.001
    zfar: 100.
    scale3d: $scale3d
    ext: .JPG
    images: images

demo_interpolate:
  fps: 60
  model_state:
    enable_sh: True
    log_query: False
  render_state:
    background: [1., 1., 1.]
  dataset:
    module: LoG.dataset.demo.InterpolatePath
    args:
      cameras: $PLYNAME
      scale: 4
      steps: 1200
      subs:
        - DJI_20231219112155_0006_Zenmuse-L1-mission
        - DJI_20231219113318_0129_Zenmuse-L1-mission
        - DJI_20231219115739_0159_Zenmuse-L1-mission
        - DJI_20231219161823_0120_Zenmuse-L1-mission
        - DJI_20231219164019_0123_Zenmuse-L1-mission
      
demo_level:
  model_state:
    enable_sh: True
    log_query: False
  dataset:
    module: LoG.dataset.demo.ShowLevel
    args:
      cameras: $PLYNAME
      steps: 10
      sub: "0001"
      scale: 4

demo_pixel:
  model_state:
    enable_sh: True
    log_query: True
  dataset:
    module: LoG.dataset.demo.ShowLevel
    args:
      mode: pixel
      cameras: $PLYNAME
      steps: 300
      sub: "0001"
      scale: 4

demo_lod:
  model_state:
    enable_sh: True
    log_query: False
  dataset:
    module: LoG.dataset.demo.ZoomInOut
    args:
      cameras: $PLYNAME
      sub: "0001"
      zranges: [-20., 0.]
      scale: 2
      use_logspace: False