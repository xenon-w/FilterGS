parents:
  - config/GauUScene/college/dataset.yml
  - config/GauUScene/college/level_of_gaussian.yml
  - config/GauUScene/college/stage_8_4.yml

exp: output/render/GauUScene/college
gpus: [0]

# Renderer used by apps/render.py (load_renderer -> cfg.train.render).
RGB_RENDER_L1_SSIM:
  module: LoG.render.renderer.NaiveRendererAndLoss
  args:
    use_origin_render: False
    use_randback: True

train:
  render: $RGB_RENDER_L1_SSIM

val:
  dataset: $val_dataset
  ckptname: /PATH/TO/YOUR/ANCESTOR/MODEL.pth
  model_state:
    enable_sh: True
    log_query: False

# Optional FilterGS visibility controls (apps/render.py reads these keys).
radius_max: 5.0
padding: 0.1
radius_filter_threshold: 700.0

# OGFS controls for apps/render.py (paper symbol naming).
ogfs_lambda_G: 0.2
ogfs_energy_floor: 0.01
ogfs_radius_ratio_min: 0.1
